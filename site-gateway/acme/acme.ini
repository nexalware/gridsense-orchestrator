; ACME site MN-CSE config for the GridSense Docker Compose stack.
; Container version of docs/acme.ini.example: hosts are compose service names,
; not a LAN IP. See docs/cse-setup.md for the interop fixes referenced below.
;
; No secret in this file. docker-compose.yml passes ACME_SECURITY_SECRET from .env.

[basic.config]
cseType = MN
cseID = id-mn
cseName = cse-mn
; Must match Mobius4's CSE_SP_ID (Fix 4)
serviceProviderID = //gridsense.local
adminID = CAdmin
networkInterface = 0.0.0.0
; Compose service name. Mobius4 reaches ACME through this host.
cseHost = acme-site
httpPort = 8081
registrarCseID = Mobius4
registrarCseName = Mobius
; Compose service name of the IN-CSE
registrarCseHost = mobius4
registrarCsePort = 7599
databaseType = tinydb
; From the environment, default info (Dockerfile). Set ACME_LOG_LEVEL=debug in
; .env to see the registrar liveness check, which logs at debug level only.
logLevel = ${ACME_LOG_LEVEL}

[textui]
enable = false

[webui]
enable = true

[cse.registrar]
INCSEcseID = /Mobius4
; Mobius4 rejects spi/dcse/ici in a <remoteCSE> create (Fix 1), and its csz
; column is VARCHAR(10)[], too short for ACME's media-type values (Fix 2).
excludeCSRAttributes = spi,dcse,ici,csz

[http.wsgi]
enable = true
