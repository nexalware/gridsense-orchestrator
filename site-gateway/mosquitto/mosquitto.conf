# Mosquitto config for the GridSense site broker (eclipse-mosquitto:2).
#
# eclipse-mosquitto:2 listens on localhost only and refuses anonymous clients
# unless configured, so without this file no other container can reach it.

# Port 1883 on all interfaces of the container.
listener 1883

# LOCAL DEV ONLY. Anonymous clients are allowed. The broker is not published to
# the host in docker-compose.yml, so only services on the compose network can
# reach it. Add password_file or TLS client certificates before publishing it
# or connecting real devices.
allow_anonymous true

# No retained state across restarts.
persistence false

# Logs to stdout so `docker compose logs mosquitto` shows them.
log_dest stdout
log_type error
log_type warning
log_type notice
